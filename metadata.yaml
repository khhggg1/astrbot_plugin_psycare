name: astrbot_plugin_psycare
display_name: 心屿 · 气象感知关怀
short_desc: 气象感知 + 群聊情绪分析：每日关怀日报与危机私聊提醒，不做诊断
desc: |
  被动分析 QQ / Telegram / Discord 群聊消息，结合当日气象数据，找出「值得关心」的线索，把结论只推给管理员私聊。

  功能：
  - 气象感知：接入 Open-Meteo 当日气温 / 降水 / 天气代码，日报增加「今日气象」；高温、寒潮、明显降水、雷暴时追加关怀提示（不参与风险评分）
  - 词频规则（165 条中文风险词条，8 个维度，带否定消解）+ 可选 LLM 语义复核
  - 每日群氛围日报：群里只发整体气氛，管理员私聊才点名到人
  - 报告卡片图（HTML + Jinja2 渲染），T2I 不可用时自动退回文字
  - WebUI 面板：群列表、成员关注度、日报历史、一键生成日报
  - 隐私优先：需管理员手动开启某个群，成员可随时 /心理退出 并清空数据

  说明：输出的是「关注度」和「建议动作」，不构成医学诊断；气象只作情境解释。
version: 1.3.2
author: khhggg1
